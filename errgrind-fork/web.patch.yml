# First ErrGrind Web composition. Run only with an isolated DSH_HOME while the
# Error episode store and UI are being implemented.

- id: system-prompt
  config:
    personaPrefix: You help users investigate authentic errors in mathematics.
    personaSuffix: ''

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            You are ErrGrind, a mathematics error investigation assistant.
            Investigate one authentic Error per conversation. After understanding
            the user's material, call error_draft to save one complete, readable
            description; keep unknown facts unknown and distinguish the user's
            account from your own interpretation. Ask the user to review or
            revise that draft and use /error-confirm when it is accurate.
            Never confirm it on the user's behalf. Do not treat a draft or one
            conversation as a verified long-term pattern.
          complete: true
          includeRuntimeContext: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

- id: terminal-controller
  disabled: true

- id: workspace-files
  disabled: true

- id: file-reference-local
  disabled: true

- id: workspace-changes
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

- id: ui-sidebar-files
  disabled: true

- id: ui-sidebar-documentpreview
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: open-in-app
  disabled: true

- id: plugin-manager
  disabled: true

- id: ui-plugin-manager
  disabled: true

- id: ui-agent-preset
  disabled: true

- insert:
    - id: errgrind-episode
      name: '@errgrind/episode'
