# ErrGrind users never export session internals; the /export command and the
# download dialog both come from this plugin.
- id: session-log-download
  disabled: true

# The permission plugin also owns the sandbox presets, so it stays mounted.
# Only the deployment's fixed read-only preset is configured above, and its
# /permission row is hidden from command discovery — hiddenCommands filters
# `list` only, so `execute` still resolves the name and a typed `/permission`
# submits as ordinary chat; removing the wider presets is what closes the
# preset-switch path. /error-confirm is hidden the same way: the revision
# card's confirm button executes the command directly, while a typed
# `/error-confirm` submits as ordinary chat — the card stays the single
# visible confirm path.
- id: commands
  config:
    hiddenCommands: [permission, error-confirm]

