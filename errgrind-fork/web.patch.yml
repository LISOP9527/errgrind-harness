# ErrGrind Web composition. The product launcher selects an isolated
# ERRGRIND_HOME; this patch keeps upstream services only where the current
# Error conversation and session recovery use them.

- id: llm-pi-ai
  config:
    filterCodexModelsByAccount: true
    providers:
      openai-codex: {}
      # Relay routes for real-model acceptance: the same gateway fronts an
      # OpenAI Responses surface (Astra) and an Anthropic Messages surface
      # (Opus), each under its own API key.
      hongyun-astra:
        displayName: Astra (Hongyun Relay)
        apiKeyEnv: ERRGRIND_RELAY_OPENAI_API_KEY
        api: openai-responses
        baseURL: https://ai.hongyun.chat/v1
        defaultInput: [text, image]
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              "off":
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      hongyun-opus:
        displayName: Opus 5.5 (Hongyun Relay)
        apiKeyEnv: ERRGRIND_RELAY_ANTHROPIC_API_KEY
        api: anthropic-messages
        baseURL: https://ai.hongyun.chat/v1
        defaultInput: [text, image]
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            # pi-ai's claude-opus-5 catalog entry only offers xhigh/max.
            reasoningEfforts:
              "off":
              xhigh: xhigh
              max: max

- id: llm-deepseek
  config:
    hideModelsWithoutCredential: true

- id: agent-default-model
  config:
    provider: hongyun-astra
    model: gpt-6-astra
    reasoningEffort: medium

- id: ui-settings-models
  config:
    credentialOnboarding: false
    welcomeNotice: false

- id: deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

- id: system-prompt
  config:
    personaPrefix: You help users investigate authentic errors in mathematics.
    personaSuffix: ''

- id: session-controller
  config:
    browserView:
      privateEventTypes:
        - errgrind/error-open
      privateMessageSourceKinds:
        - errgrind-derived-error
        - errgrind-drill-context
      allowedEventTypes:
        - turn/start
        - turn/end
        - step/start
        - step/end
        - user/message
        - errgrind/error-draft
        - errgrind/derived-error-open
        - errgrind/error-confirm
        - errgrind/error-clarify
        - errgrind/grill-probe
        - errgrind/grill-conclude
        - errgrind/teach-step
        - errgrind/drill-prepared
        - errgrind/drill-answer-draft
        - errgrind/drill-draft-finished
        - errgrind/drill-judged
      publicEventFields:
        turn/start: [turn]
        turn/end: [turn, reason]
        step/start: [turn, step]
        step/end: [turn, step]
        user/message: [id, role, content, source.kind, source.rpcId]
        errgrind/error-draft: [revision, text]
        errgrind/derived-error-open: [question, userResponse]
        errgrind/error-confirm: [revision]
        errgrind/error-clarify: [text, turn]
        errgrind/grill-probe: [anchorRevision, turn, probe.id, probe.type, probe.question]
        errgrind/grill-conclude: [anchorRevision, turn, diagnosisStatus, summary, remainingUncertainty]
        errgrind/teach-step: [kind, text, anchorRevision, diagnosisRound, turn]
        errgrind/drill-prepared: [id, question]
        errgrind/drill-answer-draft: [revision, preparationId, text]
        errgrind/drill-draft-finished: [preparationId, status]
        errgrind/drill-judged: [preparationId, isCorrect, feedback]
      allowedProjectionKeys:
        - modelSelection
        - errgrindEpisode
      redactDataKeys:
        - errgrindOriginal
      redactToolArguments: true
      redactAssistantReasoning: true
      hideAssistantStream: true

# Error conversations need image upload and Session access, but do not edit a
# workspace. Keep fresh ErrGrind Sessions read-only by default.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: read-only

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: !!js "process.getBuiltinModule('node:fs').readFileSync(process.env.ERRGRIND_PROMPT_PATH ?? (process.env.PWD + '/errgrind-fork/prompts/system.md'), 'utf8')"
          complete: true
          includeRuntimeContext: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'

