# ErrGrind Web composition. The product launcher selects an isolated
# ERRGRIND_HOME; this patch keeps upstream services only where the current
# Error conversation and session recovery use them.

- id: llm-pi-ai
  config:
    providers:
      # Relay routes for real-model acceptance: the same gateway fronts an
      # OpenAI Responses surface (Astra) and an Anthropic Messages surface
      # (Opus), each under its own API key.
      hongyun-astra:
        displayName: Astra (Hongyun Relay)
        apiKeyEnv: ERRGRIND_RELAY_OPENAI_API_KEY
        api: openai-responses
        baseURL: https://ai.hongyun.chat/v1
        defaultInput: [text, image]
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            contextWindow: 272000
            maxTokens: 128000
            input: [text, image]
            # ErrGrind users choose one of three effort rungs; the relay's
            # wider ladder stays unexposed.
            reasoningEfforts:
              low: low
              medium: medium
              high: high
      hongyun-opus:
        displayName: Opus 5.5 (Hongyun Relay)
        apiKeyEnv: ERRGRIND_RELAY_ANTHROPIC_API_KEY
        api: anthropic-messages
        # Host-only: the Anthropic SDK appends /v1/messages itself.
        baseURL: https://ai.hongyun.chat
        defaultInput: [text, image]
        # Adaptive thinking requires output_config.effort on this model; no
        # effort at all (or 'off') 400s upstream, so no-effort requests
        # dispatch xhigh and 'off' is not offered.
        reasoning: xhigh
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            # Mirrors the installed claude-opus-5 entry: this model refuses a
            # non-adaptive thinking field, so dispatch must use adaptive
            # thinking even when no effort is requested. supportsMidConvoEffort
            # is catalog-withheld and cannot be set on a declared route.
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
              supportsStrictTools: true
            # pi-ai's claude-opus-5 catalog entry only offers xhigh/max;
            # 'off' would omit effort and 400 against this model.
            reasoningEfforts:
              xhigh: xhigh
              max: max

# ErrGrind only serves the Hongyun relay routes; no DeepSeek API surface
# remains for this product, so the provider is unmounted entirely.
- id: llm-deepseek
  disabled: true

- id: agent-default-model
  config:
    provider: hongyun-astra
    model: gpt-6-astra
    reasoningEffort: medium

- id: connection
  config:
    productLabel: ErrGrind
    # ErrGrind surfaces through the Devin preview tunnel under
    # <port>--<session>.preview.devinapps.com. The proxy rewrites the request
    # Host to loopback, so the /api fence already passes; declaring the zone
    # here restores the loopback-equivalent client surface (host persistence,
    # settings) for every preview subdomain the tunnel may mint.
    localAuthorities:
      - preview.devinapps.com

# A patch row replaces the targeted row's whole `config`; the base row's
# `inject: [webStartup]` stays in place, so these `!!js` bindings resolve
# exactly as upstream while the compression level is retuned.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    # The base patch tunes for LAN speed; ErrGrind's serving path is a remote
    # tunnel where body bytes dominate, so trade server CPU for smaller pages.
    compressionLevel: 6
    compressionThresholdBytes: 1024

- id: ui-settings-models
  config:
    credentialOnboarding: false
    welcomeNotice: false
    # Providers ship in this file; the page must not offer add-provider flows.
    providerAddition: false

# ErrGrind's fixed read-only setup leaves no agent-facing preferences: hide
# the developer-tools toggle, the busy-send behavior, the performance/usage
# row, the version row, the open-configuration action, and the link-opening
# chooser (its "sidebar" choice would reopen the dock ErrGrind suppresses).
- id: ui-settings-general
  config:
    hiddenSettingsItems:
      - developer-tools
      - current-version
      - composer-enter
      - performance-usage
      - open-document
      - link-opening

# The right dock's services stay mounted for ui-chat, but ErrGrind renders no
# dock affordance in the conversation header.
- id: ui-sidebar-right
  config:
    expandButton: false

# Model switching lives on the composer chip (the conversation.input.model
# seat over the same ModelDirectoryResolver); the /model command-menu row is
# a second pointer path to the same directory that ErrGrind drops.
- id: ui-model-selection
  config:
    commandMenu: false

- id: deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

# DeepSeek-only request plumbing: ErrGrind requests go through llm-pi-ai to the
# relay, so the extension registry and both of its registrants never execute.
# Removal group G1 in design/plugin-audit.md.
- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# Delegation backends and their job registry: every tool-subagent*/ui-subagent
# row is already disabled and no mounted plugin consumes `subagents` or `jobs`.
# Removal group G2 in design/plugin-audit.md.
- id: subagent
  disabled: true

- id: subagent-spawn-in-process
  disabled: true

- id: subagent-fork-in-process
  disabled: true

- id: jobs
  disabled: true

# Goal tracking and model ask-user questions: their only consumers
# (command-goal, tool-goal, tool-ask-user, plan-mode, ui-goal) are all
# disabled, and no mounted plugin reads `goals` or `userQuestions`.
# Removal group G3 in design/plugin-audit.md.
- id: goal
  disabled: true

- id: goal-round-driver
  disabled: true

- id: user-questions
  disabled: true

# Model web backends: tool-web is already disabled, `ctx.web` is only named in
# sandbox guidance text, and web-search-deepseek wants a DEEPSEEK_API_KEY the
# product no longer carries. Removal group G4 in design/plugin-audit.md.
- id: web
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-fetch-http
  disabled: true

- id: mcp-resources
  disabled: true

# No session-telemetry coordinator is mounted, so this OTLP backend never emits.
# Removal group G5 in design/plugin-audit.md.
- id: session-telemetry-otel
  disabled: true

# directory-picker STAYS mounted: the workspace picker is unreachable in normal
# use but is the recovery surface when default-Workspace init fails (the
# defaultWorkspaceFailed toast tells the user to 'Choose workspace'), and
# remote.directoryPicker picks it by name. Removal group G6 in
# design/plugin-audit.md was reverted for this entry.
# (session-query-sqlite from the same group also stays mounted —
# session-controller declares sessionQuery as a required inject.)

- id: system-prompt
  config:
    personaPrefix: You help users investigate authentic errors in mathematics.
    personaSuffix: ''

- id: session-controller
  config:
    browserView:
      privateMessageSourceKinds:
        - errgrind-derived-error
        - errgrind-drill-context
      allowedEventTypes:
        - turn/start
        - turn/end
        - step/start
        - step/end
        - user/message
        - errgrind/error-open
        - errgrind/error-draft
        - errgrind/derived-error-open
        - errgrind/error-confirm
        - errgrind/error-clarify
        - errgrind/grill-probe
        - errgrind/grill-conclude
        - errgrind/teach-step
        - errgrind/drill-prepared
        - errgrind/drill-answer-draft
        - errgrind/drill-draft-finished
        - errgrind/drill-judged
      publicEventFields:
        turn/start: [turn]
        turn/end: [turn, reason]
        step/start: [turn, step]
        step/end: [turn, step]
        user/message: [id, role, content, source.kind, source.rpcId]
        errgrind/error-draft: [revision, text]
        errgrind/error-open: [text, turn]
        errgrind/derived-error-open: [question, userResponse, text]
        errgrind/error-confirm: [revision]
        errgrind/error-clarify: [text, turn]
        errgrind/grill-probe: [anchorRevision, turn, probe.id, probe.type, probe.question]
        errgrind/grill-conclude: [anchorRevision, turn, diagnosisStatus, summary, remainingUncertainty]
        errgrind/teach-step: [kind, text, anchorRevision, diagnosisRound, turn]
        errgrind/drill-prepared: [id, question]
        errgrind/drill-answer-draft: [revision, preparationId, text]
        errgrind/drill-draft-finished: [preparationId, status]
        errgrind/drill-judged: [preparationId, isCorrect, feedback]
      allowedProjectionKeys:
        - modelSelection
        - title
        - errgrindEpisode
      redactDataKeys:
        - errgrindOriginal
      redactToolArguments: true
      redactAssistantReasoning: true
      hideAssistantStream: true

# Error conversations need image upload and Session access, but do not edit a
# workspace. Keep fresh ErrGrind Sessions read-only by default.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
    defaultPreset: read-only

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: !!js "process.getBuiltinModule('node:fs').readFileSync(process.env.ERRGRIND_PROMPT_PATH ?? (process.env.PWD + '/errgrind-fork/prompts/system.md'), 'utf8')"
          complete: true
          includeRuntimeContext: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'

